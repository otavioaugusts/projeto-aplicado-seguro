{% extends "base.html" %}
{% block titulo %}Entrar · Projeto Aplicado{% endblock %}
{% block conteudo %}
<header class="topo">
  <p class="disciplina">UNCISAL · Segurança da Informação</p>
  <h1>Projeto Aplicado</h1>
  <p>Entre com o usuário de demonstração configurado no servidor.</p>
</header>
{% if erro %}
<p class="alerta" role="alert">{{ erro }}</p>
{% endif %}
<form method="post" action="{{ url_for('login_post') }}" autocomplete="on">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="username">Usuário</label>
  <input id="username" name="username" type="text" autocomplete="username" maxlength="64" required>
  <label for="password">Senha</label>
  <input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required>
  <button type="submit">Entrar</button>
</form>
{% endblock %}
